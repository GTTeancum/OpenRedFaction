; OpenRedFaction settings. Keep this file next to default.xbe.
; Delete it to get the fixed 60 updates-per-second behaviour.

[video]
; How fast the game runs and draws:
;   auto       60 when the console keeps up, otherwise the fallback below
;   60         always 60 game updates a second; pictures are dropped when behind
;   30         always 30 game updates a second, one picture each (steady 30 FPS)
;   30_smooth  30 game updates a second, with an in-between picture after each
;              (60 pictures a second on screen)
frame_rate = 30

; What auto switches to when 60 can't be held: 30_smooth, 30, or none
fallback = 30_smooth

; Move characters and vehicles in the in-between pictures (on/off).
; Off moves only the camera and machinery.
smooth_characters = on

; TV encoder blur: auto (none on 480p/720p, light on 480i), or 0 (sharpest) to 5.
; The resolution follows the console's video settings: 480p when it is
; enabled there with component cables, otherwise 480i.
flicker_filter = auto

; Resolution: 480, 720 or auto. auto (and 720) give 16:9 widescreen 720p
; when 720p is switched on in the console's video settings, otherwise 480.
; 720p uses double buffering to fit in 64 MB; 480 keeps triple buffering.
resolution = auto

; Colour depth: auto (32-bit), 32 or 16. 16 applies at 480p only: the
; console cannot output 720p in 16-bit colour.
color_depth = auto

; Textures: compressed uses the full-size texture pack (rfdds.vpp) built from
; your own game files; original decodes the archives (shrunk when memory is short).
textures = compressed
